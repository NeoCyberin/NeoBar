name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: NeoBar.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: call build.bat dist\NeoBar nopause
      - name: Upload build (unsigned, for testing)
        uses: actions/upload-artifact@v4
        with:
          name: NeoBar-unsigned-${{ github.sha }}
          path: dist/NeoBar
          retention-days: 14

  native:
    name: Native libraries (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build DLLs
        run: sh native/build.sh
