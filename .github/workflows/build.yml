name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: NeoBar.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings fail the build)
        shell: pwsh
        run: |
          cmd /c "build.bat dist\NeoBar nopause" 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $w = Select-String -Path build.log -Pattern 'warning CS\d+'
          if ($w) { $w | ForEach-Object { Write-Host "::error::$($_.Line)" }; exit 1 }
      - name: Self-test (crypto, hashes, safe writes, calculator)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\NeoBar\NeoBar.exe -ArgumentList '--selftest', "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Upload build (unsigned, for testing)
        uses: actions/upload-artifact@v4
        with:
          name: NeoBar-unsigned-${{ github.sha }}
          path: dist/NeoBar
          retention-days: 14

  native:
    name: Native libraries (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build DLLs
        run: sh native/build.sh
